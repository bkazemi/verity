services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity
      POSTGRES_DB: verity
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - verity-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U verity']
      interval: 2s
      retries: 15
volumes:
  verity-db:
